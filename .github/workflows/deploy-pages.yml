name: Deploy GitHub Pages — Simpul Sehat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm run install:all

      - name: Bangun bundel GitHub Pages (Static Browser Engine)
        env:
          VITE_STATIC_MODE: "true"
          VITE_BASE_PATH: "/PRJ-TA_STRUKDAT_STUDYCASE/"
        run: npm run build

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
